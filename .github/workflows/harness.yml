name: harness-check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: BASE_REF=origin/${{ github.base_ref }} bash scripts/check.sh

  # Книга: тесты пакета, линтер глав, дословность цитат, сборка и валидация EPUB.
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости сборки
        run: python -m pip install --quiet markdown pygments pillow

      - name: Тесты пакета с примерами
        working-directory: book/code
        run: python -m unittest discover -s tests -v

      - name: Линтер глав
        run: python book/tools/lint_book.py

      - name: Дословность цитат
        run: python book/tools/check_quotes.py

      - name: Сборка EPUB
        run: |
          python book/tools/build_sources_appendix.py
          python book/tools/build_epub.py

      - name: Валидация EPUB
        run: python book/tools/validate_epub.py

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: ddd-praktika-epub
          path: book/dist/ddd-praktika.epub
          if-no-files-found: error

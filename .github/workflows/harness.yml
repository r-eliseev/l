name: harness-check
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: BASE_REF=origin/${{ github.base_ref }} bash scripts/check.sh

  # Список книг: каждая книга — это каталог books/<slug> с файлом book.json.
  # Читается из репозитория, а не зашит в workflow: новая книга попадает
  # в CI сама, без правки этого файла.
  books_matrix:
    runs-on: ubuntu-latest
    outputs:
      books: ${{ steps.list.outputs.books }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          books=$(python -c "
          import json, os
          names = []
          for entry in sorted(os.listdir('books')):
              path = os.path.join('books', entry)
              if os.path.isfile(os.path.join(path, 'book.json')):
                  names.append(entry)
          print(json.dumps(names))
          ")
          echo "books=$books" >> "$GITHUB_OUTPUT"

  # Книги: для каждой — тесты пакета, линтер глав, дословность цитат,
  # проверка текста на машинные следы, сборка и валидация EPUB.
  books:
    needs: books_matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        book: ${{ fromJson(needs.books_matrix.outputs.books) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости сборки
        run: python -m pip install --quiet markdown pygments pillow

      - name: Тесты пакета с примерами
        if: hashFiles(format('books/{0}/code/tests/**', matrix.book)) != ''
        working-directory: books/${{ matrix.book }}/code
        run: python -m unittest discover -s tests -v

      - name: Линтер глав
        run: python tools/lint_book.py --book ${{ matrix.book }}

      - name: Дословность цитат
        run: python tools/check_quotes.py --book ${{ matrix.book }}

      - name: Машинные следы в тексте
        run: python tools/check_ai_tells.py --book ${{ matrix.book }}

      - name: Сборка EPUB
        run: |
          python tools/build_sources_appendix.py --book ${{ matrix.book }}
          python tools/build_epub.py --book ${{ matrix.book }}

      - name: Валидация EPUB
        run: python tools/validate_epub.py --book ${{ matrix.book }}

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.book }}-epub
          path: books/${{ matrix.book }}/dist/*.epub
          if-no-files-found: error
